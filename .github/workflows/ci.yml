name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    # Self-hosted pool (AtribuCore/atribu infra/ci-runner/README.md). CI_RUNNER repo var
    # is the switch ('atribu-ci'); unset/blank falls back to ubuntu-latest. publish.yml
    # deliberately stays on ubuntu-latest: npm provenance needs a cloud-hosted runner.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
