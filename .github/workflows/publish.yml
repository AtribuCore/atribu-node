name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Trusted-publisher environment configured in npmjs.com.
    # Protect this environment in repo Settings → Environments → npm-publish:
    #   - Deployment branches/tags: restrict to tags matching `v*` only
    #   - (Optional) Required reviewers: a human approval before publish
    # Without the environment gate, *any* tag push could publish a malicious
    # build. With it, only protected ref+approval combinations can.
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm ci

      - name: Regenerate types from spec (drift check)
        run: |
          npm run gen
          if ! git diff --exit-code src/__generated__/api.d.ts; then
            echo "::error::Generated types drift detected — run \`npm run gen\` and commit."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish (OIDC provenance)
        run: npm publish --provenance --access public
